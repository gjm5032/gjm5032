name: Update Duolingo streak

on:
  schedule:
    - cron: "7 0 * * *"
      timezone: "Asia/Seoul"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-streak:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Update streak day
        env:
          STREAK_START_DATE: "2025-12-24"
        run: |
          python - <<'PY'
          import os
          import re
          from datetime import date, datetime, timedelta, timezone
          from pathlib import Path

          readme_path = Path("README.md")
          start_marker = "<!-- DUOLINGO_STREAK:START -->"
          end_marker = "<!-- DUOLINGO_STREAK:END -->"

          start_date = date.fromisoformat(os.environ["STREAK_START_DATE"])
          korea_time = timezone(timedelta(hours=9))
          today = datetime.now(korea_time).date()
          streak_day = (today - start_date).days + 1

          if streak_day < 1:
              raise RuntimeError("The streak start date is in the future.")

          text = readme_path.read_text(encoding="utf-8")
          replacement = (
              f"{start_marker}\n"
              f"Estudio español en Duolingo — maybe day {streak_day} by now, "
              "if I haven't broken my streak. ㅎㅅㅎ\n"
              f"{end_marker}"
          )
          pattern = rf"{re.escape(start_marker)}.*?{re.escape(end_marker)}"
          updated, replacements = re.subn(pattern, replacement, text, flags=re.DOTALL)

          if replacements != 1:
              raise RuntimeError(f"Expected one streak block, found {replacements}.")

          readme_path.write_text(updated, encoding="utf-8", newline="\n")
          print(f"Duolingo streak is day {streak_day} on {today}.")
          PY

      - name: Commit updated README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md

          if git diff --cached --quiet; then
            echo "README is already up to date."
          else
            git commit -m "Update Duolingo streak"
            git push
          fi
